services:
  # -------------------------------------------------------------
  # 1. Flask REST API Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: academic-question-system-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
        # e.g., https://academic-question-system-web.onrender.com
      - key: DB_HOST
        sync: false
        # e.g., mysql-xxxxx.aivencloud.com
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
        # e.g., defaultdb or academic_question_system
      - key: DB_USER
        sync: false
        # e.g., avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"

  # -------------------------------------------------------------
  # 2. Frontend Static Site
  # -------------------------------------------------------------
  - type: static
    name: academic-question-system-web
    rootDir: .
    publishPath: .
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
