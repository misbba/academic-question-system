<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Academic System</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-academic">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-journal-bookmark-fill text-warning"></i>
        Academic Question & Balancing System
      </a>
      <div class="ms-auto">
        <a href="student-login.html" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i> Back to Student Login</a>
      </div>
    </div>
  </nav>

  <!-- Content Container -->
  <div class="container my-4">
    <div class="auth-container" style="max-width: 580px;">
      <div class="card card-academic shadow">
        <div class="card-academic-header text-center py-3">
          <span class="role-badge role-badge-student mb-2 d-inline-block">Student Onboarding</span>
          <h2 class="h4 mb-0">Student Registration</h2>
        </div>
        <div class="card-body p-4">
          <form id="studentRegisterForm">
            
            <div class="row g-3">
              <div class="col-md-12">
                <label for="regStudentName" class="form-label fw-semibold">Full Student Name</label>
                <input type="text" class="form-control" id="regStudentName" placeholder="e.g. Jenitta Blessy" required>
              </div>

              <div class="col-md-6">
                <label for="regRollNo" class="form-label fw-semibold">University Roll Number</label>
                <input type="text" class="form-control" id="regRollNo" placeholder="e.g. 2024-AIDS-042" required>
              </div>

              <div class="col-md-6">
                <label for="regSem" class="form-label fw-semibold">Current Semester</label>
                <select class="form-select" id="regSem" required>
                  <option value="Sem 2">Semester 2</option>
                  <option value="Sem 4">Semester 4</option>
                  <option value="Sem 6" selected>Semester 6</option>
                  <option value="Sem 8">Semester 8</option>
                </select>
              </div>

              <div class="col-md-12">
                <label for="regStudentDept" class="form-label fw-semibold">Academic Department</label>
                <select class="form-select" id="regStudentDept" required>
                  <option value="Artificial Intelligence & Data Science" selected>Artificial Intelligence & Data Science</option>
                  <option value="Artificial Intelligence & Machine Learning">Artificial Intelligence & Machine Learning</option>
                  <option value="Computer and Communication Engineering">Computer and Communication Engineering</option>
                </select>
              </div>

              <div class="col-md-12">
                <label for="regStudentEmail" class="form-label fw-semibold">Student Institutional Email</label>
                <input type="email" class="form-control" id="regStudentEmail" placeholder="student@student.university.edu" required>
              </div>

              <div class="col-md-6">
                <label for="regStudentPass" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="regStudentPass" required>
              </div>

              <div class="col-md-6">
                <label for="regStudentPassConfirm" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" class="form-control" id="regStudentPassConfirm" required>
              </div>

              <div class="col-12">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="studentTerms" required checked>
                  <label class="form-check-label small text-muted" for="studentTerms">
                    I agree to the Honor Code and Online Assessment Integrity Rules.
                  </label>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-academic-secondary w-100 py-2 fs-6 mt-4">
              <i class="bi bi-person-plus me-2"></i>Register & Access Student Portal
            </button>
          </form>
        </div>
        <div class="card-footer text-center bg-light border-top p-3">
          <p class="small text-muted mb-0">Already have a student account? <a href="student-login.html" class="fw-bold text-secondary">Login Here</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-academic mt-auto">
    <div class="container">
      <p class="mb-0">Academic Question Generation & Difficulty Balancing System &copy; 2026</p>
    </div>
  </footer>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js?v=20261025"></script>
  <script src="js/mock-data.js?v=20261025"></script>
  <script src="js/app.js?v=20261025"></script>
</body>
</html>
