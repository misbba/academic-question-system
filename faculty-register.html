<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Registration | Academic System</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-academic">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-journal-bookmark-fill text-warning"></i>
        Academic Question & Balancing System
      </a>
      <div class="ms-auto">
        <a href="faculty-login.html" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i> Back to Faculty Login</a>
      </div>
    </div>
  </nav>

  <!-- Registration Form Container -->
  <div class="container my-4">
    <div class="auth-container" style="max-width: 580px;">
      <div class="card card-academic shadow">
        <div class="card-academic-header text-center py-3">
          <span class="role-badge role-badge-faculty mb-2 d-inline-block">Faculty Onboarding</span>
          <h2 class="h4 mb-0">Faculty Account Registration</h2>
        </div>
        <div class="card-body p-4">
          <form id="facultyRegisterForm">
            
            <div class="row g-3">
              <div class="col-md-12">
                <label for="regName" class="form-label fw-semibold">Full Name (with Title)</label>
                <input type="text" class="form-control" id="regName" placeholder="e.g. Dr. Murugan" required>
              </div>

              <div class="col-md-6">
                <label for="regFacultyId" class="form-label fw-semibold">Faculty Employee ID</label>
                <input type="text" class="form-control" id="regFacultyId" placeholder="e.g. FAC-9082" required>
              </div>

              <div class="col-md-6">
                <label for="regDesignation" class="form-label fw-semibold">Designation</label>
                <select class="form-select" id="regDesignation" required>
                  <option value="Professor">Professor</option>
                  <option value="Associate Professor" selected>Associate Professor</option>
                  <option value="Assistant Professor">Assistant Professor</option>
                  <option value="Lecturer">Lecturer / Instructor</option>
                </select>
              </div>

              <div class="col-md-12">
                <label for="regDept" class="form-label fw-semibold">Department</label>
                <select class="form-select" id="regDept" required>
                  <option value="Artificial Intelligence & Data Science" selected>Artificial Intelligence & Data Science</option>
                  <option value="Artificial Intelligence & Machine Learning">Artificial Intelligence & Machine Learning</option>
                  <option value="Computer and Communication Engineering">Computer and Communication Engineering</option>
                </select>
              </div>

              <div class="col-md-12">
                <label for="regEmail" class="form-label fw-semibold">Official University Email</label>
                <input type="email" class="form-control" id="regEmail" placeholder="name@university.edu" required>
              </div>

              <div class="col-md-6">
                <label for="regPass" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="regPass" required>
              </div>

              <div class="col-md-6">
                <label for="regPassConfirm" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" class="form-control" id="regPassConfirm" required>
              </div>

              <div class="col-12">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="termsCheck" required checked>
                  <label class="form-check-label small text-muted" for="termsCheck">
                    I agree to the Institutional Academic Code & Examination Integrity Policy.
                  </label>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-academic-primary w-100 py-2 fs-6 mt-4">
              <i class="bi bi-person-plus me-2"></i>Register & Access Faculty Portal
            </button>
          </form>
        </div>
        <div class="card-footer text-center bg-light border-top p-3">
          <p class="small text-muted mb-0">Already registered? <a href="faculty-login.html" class="fw-bold text-primary">Login Here</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-academic mt-auto">
    <div class="container">
      <p class="mb-0">Academic Question Generation & Difficulty Balancing System &copy; 2026</p>
    </div>
  </footer>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js?v=20261025"></script>
  <script src="js/mock-data.js?v=20261025"></script>
  <script src="js/app.js?v=20261025"></script>
</body>
</html>
